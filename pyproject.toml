[project]
name = "mongopolyglot-enterprise"
version = "1.0.0"
description = "Enterprise MongoDB & SQL Polyglot Database Platform with Aggregations, Profiling, and ACID Transactions (21CSE562T CLA-2)"
authors = [{ name = "Principal Database Systems Engineer" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "motor>=3.3.2",
    "pymongo>=4.6.2",
    "mongomock-motor>=0.0.30",
    "mongomock>=4.1.2",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "aiosqlite>=0.20.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
