version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mongopolyglot_app
    ports:
      - "8000:8000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/mongopolyglot_enterprise
      - MONGO_DB_NAME=mongopolyglot_enterprise
      - SQL_DB_PATH=/app/data/polyglot_relational.db
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8000
    depends_on:
      - mongodb
    volumes:
      - app_data:/app/data
    restart: unless-stopped

  mongodb:
    image: mongo:7.0
    container_name: mongopolyglot_db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  app_data:
  mongo_data:
